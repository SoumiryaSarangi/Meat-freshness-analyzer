<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- 3D Lower Thickness -->
    <path d="M14 36 C11 43, 19 48, 25 52 C36 55, 46 51, 54 40 C54 35, 52 38, 45 44 C39 47, 29 48, 20 44 C14 40, 14 36, 14 36 Z" fill="#A83240"/>

    <!-- Outer Fat Layer (Smooth Cream) -->
    <path d="M23 14 C31 11, 43 11, 52 18 C55 24, 55 33, 48 42 C42 48, 30 51, 19 48 C11 43, 9 28, 14 19 C16 16, 19 15, 23 14 Z" fill="#FFF4DE" stroke="#F5E6CC" stroke-width="0.8"/>

    <!-- Main Meat Cutlet Face -->
    <path d="M24 17.5 C31 14.5, 41 14.5, 48 20.5 C51 25.5, 51 31.5, 45 39 C39 44.5, 29 47, 20 44.5 C14 40, 12 28, 16.5 21 C18 19, 21 18, 24 17.5 Z" fill="#E83D56"/>

    <!-- Marbling Branches -->
    <path d="M36 24 C30 30, 19 35, 19 35" stroke="#FFF4DE" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M36 24 C38 33, 34 43, 34 43" stroke="#FFF4DE" stroke-width="2.8" stroke-linecap="round" fill="none"/>

    <!-- Bone (White with Dark Marrow Core) -->
    <circle cx="36" cy="23" r="6" fill="#FFF4DE"/>
    <circle cx="36" cy="23" r="2.5" fill="#5A1620"/>
  </g>
</svg>

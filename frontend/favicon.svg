<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE07A"/>
      <stop offset="100%" stop-color="#E5A82E"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BD3BA6"/>
      <stop offset="100%" stop-color="#8E207C"/>
    </linearGradient>
    <linearGradient id="stripGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A201E"/>
      <stop offset="100%" stop-color="#121614"/>
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Container Tile -->
  <rect width="64" height="64" rx="16" fill="#0B0D0C"/>
  <rect x="0.9" y="0.9" width="62.2" height="62.2" rx="15.1" fill="none" stroke="#242927" stroke-width="1.8"/>

  <!-- Frosted Biosensor Strip Substrate -->
  <rect x="5" y="14" width="54" height="36" rx="7" fill="url(#stripGrad)" stroke="#2E3633" stroke-width="1.4"/>

  <!-- 3 Gold Electrode Contact Pads -->
  <rect x="8.5" y="19.5" width="11" height="6" rx="1.5" fill="url(#goldGrad)" stroke="#FFE07A" stroke-width="0.6"/>
  <rect x="8.5" y="28.7" width="11" height="6" rx="1.5" fill="url(#goldGrad)" stroke="#FFE07A" stroke-width="0.6"/>
  <rect x="8.5" y="37.9" width="11" height="6" rx="1.5" fill="url(#goldGrad)" stroke="#FFE07A" stroke-width="0.6"/>

  <!-- Gold Micro-Circuit Traces (45-degree precision routing) -->
  <path d="M 19.5 22.5 L 29 22.5 L 34.5 28 L 41 28" fill="none" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 19.5 32 L 41 32" fill="none" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 19.5 41.5 L 29 41.5 L 34.5 36 L 41 36" fill="none" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Circular Reaction Well & Electrodes -->
  <!-- Outer Gold Bezel -->
  <circle cx="45.5" cy="32" r="13" fill="#F0BC35" stroke="#FFE58F" stroke-width="1.2"/>
  <!-- Middle Frosted Isolation Ring -->
  <circle cx="45.5" cy="32" r="10.8" fill="#F5F6F0" stroke="#D6A020" stroke-width="0.8"/>
  <!-- Active Biogenic Amine Enzyme Core (Purple) -->
  <circle cx="45.5" cy="32" r="9.2" fill="url(#purpleGrad)"/>
  <!-- Radiant Core Glow -->
  <circle cx="45.5" cy="32" r="6" fill="#BD3BA6" opacity="0.85"/>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meat QC — Freshness Scanner</title>
  <meta name="description" content="AI-powered meat freshness scanner. Point your camera or upload photos to get instant routing decisions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Core */
      --bg:          #0A0B0A;
      --surface:     #17191A;
      --surface-2:   #1E2120;
      --ink:         #F3F4F0;
      --muted:       #8C948D;
      --line:        #2A2D2A;

      /* Verdicts */
      --good:        #37E39A;
      --good-dim:    #173B2C;
      --spoiled:     #FF5C5C;
      --spoiled-dim: #3D1919;
      --review:      #FFC93C;
      --review-dim:  #3D3112;

      /* CTA only */
      --accent:      #D6FF3F;
      --accent-ink:  #0A0B0A;

      --radius:      16px;
      --radius-sm:   10px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      /* bottom bar clearance */
      padding-bottom: 112px;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    header {
      padding: 20px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      letter-spacing: -0.5px;
    }
    .logo em { color: var(--good); font-style: normal; }
    .badge-model {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 99px;
      font-size: 0.68rem;
      padding: 4px 10px;
      color: var(--muted);
    }

    /* ── Main scroll area ───────────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px 16px 0;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Upload/Camera toggle ────────────────────────────────────────── */
    .input-toggle {
      display: none; /* shown only when camera is available */
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .input-toggle.visible { display: flex; }
    .toggle-link {
      background: none;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .toggle-link:hover { color: var(--ink); }
    .toggle-sep { color: var(--line); }

    /* ── Camera panel ───────────────────────────────────────────────── */
    #camera-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .camera-viewport {
      position: relative;
      width: 100%;
      border-radius: var(--radius);
      overflow: hidden;
      background: #000;
      aspect-ratio: 4/3;
    }
    #camera-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #camera-canvas { display: none; }
    #camera-error {
      display: none;
      background: rgba(255,92,92,0.10);
      border: 1px solid rgba(255,92,92,0.30);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 0.83rem;
      color: var(--spoiled);
      text-align: center;
      line-height: 1.5;
    }
    .cam-hint {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }
    .cam-hint strong { color: var(--review); }

    /* ── Upload dropzone ────────────────────────────────────────────── */
    #drop-zone {
      display: none; /* hidden initially; upload is secondary */
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 36px 24px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      text-align: center;
      user-select: none;
    }
    #drop-zone.active-mode { display: flex; }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(214,255,63,0.04);
    }
    .drop-icon { font-size: 2.4rem; }
    .drop-title { font-family: 'Space Grotesk', sans-serif; font-size: 1rem; }
    .drop-sub { font-size: 0.75rem; color: var(--muted); line-height: 1.6; }
    #file-input { display: none; }

    /* ── Preview strip ───────────────────────────────────────────────── */
    #preview-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .thumb-wrap {
      position: relative;
      width: 64px; height: 64px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      flex-shrink: 0;
    }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-remove {
      position: absolute;
      top: 2px; right: 2px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: rgba(0,0,0,.75);
      border: none;
      color: #fff;
      font-size: 0.55rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-wrap.from-camera::after {
      content: '📷';
      position: absolute;
      bottom: 2px; left: 3px;
      font-size: 0.55rem;
    }

    /* ── Spinner ─────────────────────────────────────────────────────── */
    .spinner {
      display: none;
      width: 28px; height: 28px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 8px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Results section ────────────────────────────────────────────── */
    #results-section { display: none; }

    /* Summary strip */
    .summary-strip {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      font-size: 0.78rem;
    }
    .summary-total {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      color: var(--ink);
    }
    .summary-dot {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.good    { background: var(--good); }
    .dot.spoiled { background: var(--spoiled); }
    .dot.review  { background: var(--review); }

    /* Results feed */
    #results-feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Result card ─────────────────────────────────────────────────── */
    .result-card {
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
      border: 1px solid var(--line);
      animation: fadeUp .3s ease both;
      transition: transform .2s;
    }
    .result-card:hover { transform: translateY(-2px); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .result-card.good    { border-color: rgba(55,227,154,.4); box-shadow: 0 0 24px rgba(55,227,154,.12); }
    .result-card.spoiled { border-color: rgba(255,92,92,.4);  box-shadow: 0 0 24px rgba(255,92,92,.12); }
    .result-card.review  { border-color: rgba(255,201,60,.4); box-shadow: 0 0 24px rgba(255,201,60,.12); }
    .result-card.error   { opacity: .65; }

    /* Card image */
    .card-img-wrap {
      width: 100%;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    .card-img-wrap img {
      width: 100%;
      display: block;
      object-fit: contain;
      max-height: 420px;
    }
    .ann-unavailable {
      padding: 48px 24px;
      text-align: center;
      font-size: .8rem;
      color: var(--muted);
    }

    /* Card body */
    .card-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-filename {
      font-size: .68rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Decision pill */
    .decision-pill {
      font-family: 'Space Grotesk', sans-serif;
      font-size: .82rem;
      padding: 5px 13px;
      border-radius: 99px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .decision-pill.discard  { background: var(--spoiled-dim); color: var(--spoiled); }
    .decision-pill.grinding { background: var(--good-dim);    color: var(--good); }
    .decision-pill.packing  { background: var(--good-dim);    color: var(--good); }
    .decision-pill.review   { background: var(--review-dim);  color: var(--review); }

    /* Size meta */
    .size-meta {
      font-size: .72rem;
      color: var(--muted);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .size-tag {
      padding: 2px 8px;
      border-radius: 5px;
      border: 1px solid var(--line);
    }
    .size-tag.measured  { border-color: rgba(55,227,154,.35); color: var(--good); }
    .size-tag.estimated { border-color: rgba(255,201,60,.35); color: var(--review); }

    /* Download btn */
    .download-btn {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-family: inherit;
      font-size: .75rem;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .download-btn:hover { color: var(--ink); border-color: var(--ink); }

    /* ── Sticky bottom bar ───────────────────────────────────────────── */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px 20px;
      background: linear-gradient(to top, var(--bg) 70%, transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 100;
    }
    #check-btn, #scan-again-btn {
      width: 100%;
      max-width: 608px;
      padding: 16px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: var(--accent-ink);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity .15s, transform .15s;
    }
    #check-btn:hover:not(:disabled),
    #scan-again-btn:hover { opacity: .9; transform: translateY(-1px); }
    #check-btn:disabled { opacity: .4; cursor: not-allowed; }
    #scan-again-btn { display: none; }

    .gallery-link {
      font-size: .75rem;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .gallery-link:hover { color: var(--ink); }

    /* #check-btn hidden until files queued */
    #check-btn { display: none; }

    /* Capture btn (inside camera panel) */
    #capture-btn {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      font-size: .95rem;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    #capture-btn:hover:not(:disabled) { border-color: var(--accent); }
    #capture-btn:disabled { opacity: .35; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <div class="logo">Meat <em>QC</em></div>
  <div class="badge-model">MobileNetV2 · 94.2% acc</div>
</header>

<main>

  <!-- Input mode toggle (hidden until camera support confirmed) -->
  <div class="input-toggle" id="input-toggle">
    <span id="mode-label">📷 Camera</span>
    <span class="toggle-sep">·</span>
    <button class="toggle-link" id="mode-switch-btn" type="button">Switch to upload</button>
  </div>

  <!-- Camera panel (shown by default when supported) -->
  <div id="camera-panel">
    <div class="camera-viewport">
      <video id="camera-video" autoplay playsinline muted></video>
    </div>
    <canvas id="camera-canvas"></canvas>
    <div id="camera-error"></div>
    <div class="cam-hint">
      <strong>Tip:</strong> place an ID card next to the meat for accurate size measurement.
    </div>
    <button id="capture-btn" type="button" disabled>📷 Capture Photo</button>
  </div>

  <!-- Upload zone (hidden by default) -->
  <div id="drop-zone" role="button" tabindex="0" aria-label="Upload meat photos">
    <div class="drop-icon">🥩</div>
    <div class="drop-title">Drop photos here</div>
    <div class="drop-sub">or tap to choose from gallery<br/>JPEG · PNG · up to 20 MB<br/><br/>
      <strong style="color:var(--review)">Tip:</strong> include an ID card next to the meat for accurate size.</div>
    <input id="file-input" type="file" accept="image/*" multiple />
  </div>

  <!-- Shared thumbnail queue -->
  <div id="preview-strip"></div>

  <!-- Spinner -->
  <div class="spinner" id="spinner"></div>

  <!-- Results -->
  <section id="results-section">
    <div class="summary-strip" id="summary-strip"></div>
    <div id="results-feed"></div>
  </section>

</main>

<!-- Sticky bottom bar -->
<div class="bottom-bar">
  <button id="check-btn" type="button">🔬 Analyse Photos</button>
  <button id="scan-again-btn" type="button">📷 Scan Another</button>
  <button class="gallery-link" id="gallery-link" type="button" style="display:none">or upload from gallery</button>
</div>

<script>
  // ── State ────────────────────────────────────────────────────────────────
  let selectedFiles = [];
  let activeMode    = 'camera';   // 'camera' | 'upload'
  let cameraStream  = null;

  // ── DOM refs ─────────────────────────────────────────────────────────────
  const inputToggle   = document.getElementById('input-toggle');
  const modeLabel     = document.getElementById('mode-label');
  const modeSwitchBtn = document.getElementById('mode-switch-btn');
  const cameraPanel   = document.getElementById('camera-panel');
  const cameraVideo   = document.getElementById('camera-video');
  const cameraCanvas  = document.getElementById('camera-canvas');
  const cameraError   = document.getElementById('camera-error');
  const captureBtn    = document.getElementById('capture-btn');
  const dropZone      = document.getElementById('drop-zone');
  const fileInput     = document.getElementById('file-input');
  const previewStrip  = document.getElementById('preview-strip');
  const spinner       = document.getElementById('spinner');
  const resultsSection= document.getElementById('results-section');
  const summaryStrip  = document.getElementById('summary-strip');
  const resultsFeed   = document.getElementById('results-feed');
  const checkBtn      = document.getElementById('check-btn');
  const scanAgainBtn  = document.getElementById('scan-again-btn');
  const galleryLink   = document.getElementById('gallery-link');

  // ── Feature-detect camera ────────────────────────────────────────────────
  const hasCamera = !!navigator.mediaDevices?.getUserMedia;

  if (hasCamera) {
    inputToggle.classList.add('visible');
    galleryLink.style.display = 'block';
    // Camera is default — start immediately
    startCamera();
  } else {
    // No camera: show upload zone as the only option
    cameraPanel.style.display = 'none';
    dropZone.classList.add('active-mode');
    activeMode = 'upload';
  }

  // ── Mode switching ────────────────────────────────────────────────────────
  modeSwitchBtn.addEventListener('click', () => {
    switchMode(activeMode === 'camera' ? 'upload' : 'camera');
  });

  function switchMode(mode) {
    if (activeMode === mode) return;
    activeMode = mode;

    if (mode === 'camera') {
      modeLabel.textContent = '📷 Camera';
      modeSwitchBtn.textContent = 'Switch to upload';
      dropZone.classList.remove('active-mode');
      cameraPanel.style.display = 'flex';
      galleryLink.style.display = 'block';
      startCamera();
    } else {
      modeLabel.textContent = '🗂 Upload';
      modeSwitchBtn.textContent = 'Switch to camera';
      cameraPanel.style.display = 'none';
      dropZone.classList.add('active-mode');
      galleryLink.style.display = 'none';
      stopCamera();
    }
  }

  // ── Camera lifecycle ──────────────────────────────────────────────────────
  async function startCamera() {
    cameraError.style.display = 'none';
    captureBtn.disabled = true;
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }
      });
      cameraVideo.srcObject = cameraStream;
      await new Promise(resolve => {
        cameraVideo.onloadedmetadata = resolve;
        if (cameraVideo.readyState >= 1) resolve();
      });
      captureBtn.disabled = false;
    } catch (err) {
      let msg = 'Camera error.';
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')
        msg = 'Camera permission denied. Allow access in browser settings.';
      else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError')
        msg = 'No camera found on this device.';
      else if (err.name === 'NotReadableError')
        msg = 'Camera is in use by another app.';
      else if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1')
        msg = 'Camera requires HTTPS. Use localhost or open over HTTPS.';
      else
        msg = `Camera error: ${err.message}`;
      cameraError.textContent = msg;
      cameraError.style.display = 'block';
    }
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
    }
    cameraVideo.srcObject = null;
    captureBtn.disabled = true;
  }

  window.addEventListener('pagehide', stopCamera);

  // ── Capture ───────────────────────────────────────────────────────────────
  captureBtn.addEventListener('click', () => {
    if (!cameraStream) return;
    const vw = cameraVideo.videoWidth, vh = cameraVideo.videoHeight;
    if (!vw || !vh) return;
    cameraCanvas.width  = vw;
    cameraCanvas.height = vh;
    cameraCanvas.getContext('2d').drawImage(cameraVideo, 0, 0, vw, vh);
    cameraCanvas.toBlob(blob => {
      const file = new File([blob], `camera_capture_${Date.now()}.jpg`, { type: 'image/jpeg' });
      file._fromCamera = true;
      addFiles([file]);
      captureBtn.innerHTML = '✔ Captured!';
      captureBtn.disabled  = true;
      setTimeout(() => { captureBtn.innerHTML = '📷 Capture Photo'; captureBtn.disabled = false; }, 700);
    }, 'image/jpeg', 0.92);
  });

  // ── Upload zone ───────────────────────────────────────────────────────────
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });
  fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });
  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    addFiles([...e.dataTransfer.files].filter(f => f.type.startsWith('image/')));
  });

  // gallery link in bottom bar = switch to upload mode
  galleryLink.addEventListener('click', () => switchMode('upload'));

  // ── Shared file queue ─────────────────────────────────────────────────────
  function addFiles(files) {
    files.forEach(f => {
      if (!selectedFiles.find(x => x.name === f.name && x.size === f.size))
        selectedFiles.push(f);
    });
    renderPreviews();
  }

  function removeFile(idx) {
    selectedFiles.splice(idx, 1);
    renderPreviews();
  }

  function renderPreviews() {
    previewStrip.innerHTML = '';
    selectedFiles.forEach((file, idx) => {
      const url  = URL.createObjectURL(file);
      const wrap = document.createElement('div');
      wrap.className = 'thumb-wrap' + (file._fromCamera ? ' from-camera' : '');
      wrap.innerHTML = `<img src="${url}" alt="${file.name}" />
        <button class="thumb-remove" title="Remove" aria-label="Remove ${file.name}">✕</button>`;
      wrap.querySelector('.thumb-remove').addEventListener('click', () => removeFile(idx));
      previewStrip.appendChild(wrap);
    });
    checkBtn.style.display  = selectedFiles.length ? 'block' : 'none';
    scanAgainBtn.style.display = 'none';
  }

  // ── Submit ────────────────────────────────────────────────────────────────
  checkBtn.addEventListener('click', submitFiles);
  scanAgainBtn.addEventListener('click', () => {
    selectedFiles = [];
    renderPreviews();
    resultsSection.style.display = 'none';
    scanAgainBtn.style.display   = 'none';
    checkBtn.style.display       = 'none';
    // Switch back to camera if it was the active mode
    if (hasCamera && activeMode === 'camera') startCamera();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  async function submitFiles() {
    if (!selectedFiles.length) return;
    checkBtn.disabled   = true;
    spinner.style.display  = 'block';
    resultsSection.style.display = 'none';

    const fd = new FormData();
    selectedFiles.forEach(f => fd.append('files', f));

    try {
      const resp = await fetch('/api/classify', { method: 'POST', body: fd });
      if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
      const data = await resp.json();
      renderResults(data.results);
    } catch (err) {
      resultsFeed.innerHTML = `<p style="color:var(--spoiled);padding:16px">Error: ${err.message}</p>`;
      resultsSection.style.display = 'block';
    } finally {
      spinner.style.display = 'none';
      checkBtn.disabled     = false;
    }
  }

  // ── Render results ────────────────────────────────────────────────────────
  function renderResults(results) {
    resultsFeed.innerHTML = '';

    // Summary counts
    let nGood = 0, nSpoiled = 0, nReview = 0;
    results.forEach(r => {
      if (r.error) return;
      if (r.label === 'good' && r.size_method !== 'multiple_pieces_detected') nGood++;
      else if (r.label === 'spoiled') nSpoiled++;
      else if (r.size_method === 'multiple_pieces_detected' || r.decision === 'needs_manual_review') nReview++;
      else nGood++;
    });

    summaryStrip.innerHTML = `
      <span class="summary-total">${results.length} photo${results.length !== 1 ? 's' : ''}</span>
      ${nGood    ? `<span class="summary-dot"><span class="dot good"></span>${nGood} good</span>` : ''}
      ${nSpoiled ? `<span class="summary-dot"><span class="dot spoiled"></span>${nSpoiled} spoiled</span>` : ''}
      ${nReview  ? `<span class="summary-dot"><span class="dot review"></span>${nReview} review</span>` : ''}
    `;

    results.forEach((r, i) => {
      const card = document.createElement('div');
      card.style.animationDelay = `${i * 50}ms`;

      // Error case
      if (r.error) {
        card.className = 'result-card error';
        card.innerHTML = `
          <div class="card-body">
            <div class="card-filename">${r.filename}</div>
            <div style="color:var(--spoiled);font-size:.85rem">⚠ ${r.error}</div>
          </div>`;
        resultsFeed.appendChild(card);
        return;
      }

      // Determine card class
      let cardCls = r.label === 'spoiled' ? 'spoiled'
        : (r.size_method === 'multiple_pieces_detected' || r.decision === 'needs_manual_review') ? 'review'
        : 'good';
      card.className = `result-card ${cardCls}`;

      // Accessible alt text baked from result data
      const decisionLabel = r.decision ? r.decision.toUpperCase() : '';
      const mmText = r.longest_dimension_mm ? `, ${r.longest_dimension_mm} mm` : '';
      const piecesText = r.piece_count_estimate > 1 ? `, ~${r.piece_count_estimate} pieces` : '';
      const altText = r.size_method === 'multiple_pieces_detected'
        ? `${r.label}, ~${r.piece_count_estimate} pieces detected, routed to grinding`
        : `${r.label}, ${Math.round((r.label === 'good' ? r.good_confidence : r.spoiled_confidence) * 100)}% confidence${mmText}, routed to ${r.decision}`;

      // Image section
      let imgHTML;
      if (r.annotated_image_base64) {
        imgHTML = `<div class="card-img-wrap">
          <img src="${r.annotated_image_base64}" alt="${altText}" loading="lazy" />
        </div>`;
      } else {
        // Find the queued file thumbnail as fallback
        const queuedFile = selectedFiles.find(f => f.name === r.filename);
        if (queuedFile) {
          const thumbUrl = URL.createObjectURL(queuedFile);
          imgHTML = `<div class="card-img-wrap">
            <img src="${thumbUrl}" alt="${altText}" loading="lazy" />
            <div style="position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.7);color:#aaa;font-size:.68rem;padding:3px 8px;border-radius:4px">annotation unavailable</div>
          </div>`;
        } else {
          imgHTML = `<div class="card-img-wrap"><div class="ann-unavailable">📷 No preview available</div></div>`;
        }
      }

      // Decision pill
      const decisionIcons = { discard: '🗑', grinding: '⚙', packing: '📦', needs_manual_review: '🔍' };
      const pillCls = r.decision === 'needs_manual_review' ? 'review'
        : r.decision === 'discard' ? 'discard'
        : r.decision === 'grinding' ? 'grinding'
        : 'packing';
      const pillLabel = r.size_method === 'multiple_pieces_detected'
        ? '⚙ GRINDING (multi-piece)'
        : `${decisionIcons[r.decision] || ''} ${decisionLabel}`;

      // Size tags
      const methodTag = r.size_method === 'measured'
        ? `<span class="size-tag measured">📐 Measured</span>`
        : r.size_method === 'estimated'
        ? `<span class="size-tag estimated">~ Estimated</span>`
        : '';
      const mmTag = r.longest_dimension_mm != null
        ? `<span class="size-tag">${r.longest_dimension_mm} mm</span>`
        : '';
      const pieceTag = r.piece_count_estimate > 0 && r.size_method === 'multiple_pieces_detected'
        ? `<span class="size-tag" style="color:var(--review);border-color:rgba(255,201,60,.35)">🎲 ~${r.piece_count_estimate} pieces</span>`
        : '';
      const sizeMeta = (methodTag || mmTag || pieceTag)
        ? `<div class="size-meta">${methodTag}${mmTag}${pieceTag}</div>` : '';

      // Download button (only if annotated image is present)
      const dlBtn = r.annotated_image_base64
        ? `<button class="download-btn" data-b64="${r.annotated_image_base64}" data-filename="${r.filename}">
            ⬇ Save
          </button>`
        : '';

      card.innerHTML = `
        ${imgHTML}
        <div class="card-body">
          <div class="card-filename" title="${r.filename}">${r.filename}</div>
          <div class="card-meta-row">
            <span class="decision-pill ${pillCls}">${pillLabel}</span>
            ${dlBtn}
          </div>
          ${sizeMeta}
        </div>`;

      // Wire download button
      const btn = card.querySelector('.download-btn');
      if (btn) {
        btn.addEventListener('click', () => {
          const b64 = btn.dataset.b64.replace('data:image/jpeg;base64,', '');
          const bin = atob(b64);
          const arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          const blob = new Blob([arr], { type: 'image/jpeg' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `annotated_${btn.dataset.filename.replace(/\.[^.]+$/, '')}.jpg`;
          a.click();
          URL.revokeObjectURL(a.href);
        });
      }

      resultsFeed.appendChild(card);
    });

    resultsSection.style.display = 'block';
    checkBtn.style.display        = 'none';
    scanAgainBtn.style.display    = 'block';
    resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Marbl — Freshness Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0A0B0A; --surface:#17191A; --surface-2:#1E2120;
    --ink:#F3F4F0; --muted:#8C948D; --line:#2A2D2A;
    --good:#37E39A; --good-dim:#173B2C;
    --spoiled:#FF5C5C; --spoiled-dim:#3D1919;
    --review:#FFC93C; --review-dim:#3D3112;
    --accent:#D6FF3F;
  }
  * { box-sizing:border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  
  /* Main Container (Responsive) */
  .app-container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  
  .content { flex: 1; overflow-y: auto; padding: 18px 16px 0; }
  
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .word { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; color: var(--ink); letter-spacing: -0.01em; }
  
  .mode-toggle { display: none; background: var(--surface); border-radius: 20px; padding: 3px; border: 0.5px solid var(--line); cursor: pointer; }
  .mode-toggle.visible { display: flex; }
  .mode-toggle span { padding: 6px 14px; font-size: 13px; color: var(--muted); border-radius: 16px; transition: all 0.2s; }
  .mode-toggle span.on { background: var(--surface-2); color: var(--ink); font-weight: 500; }

  /* Camera Panel */
  #camera-panel { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .camera-viewport { position: relative; width: 100%; border-radius: 20px; overflow: hidden; background: #000; aspect-ratio: 4/3; border: 0.5px solid var(--line); }
  #camera-video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #camera-canvas { display: none; }
  #camera-error { display: none; background: rgba(255,92,92,0.10); border: 1px solid rgba(255,92,92,0.30); border-radius: 12px; padding: 14px 16px; font-size: 13px; color: var(--spoiled); text-align: center; }
  .cam-hint { font-size: 12px; color: var(--muted); text-align: center; }
  .cam-hint strong { color: var(--review); }
  
  /* Capture Button */
  #capture-btn-inline {
    background: var(--accent); color: #10130a; border: none; border-radius: 18px; padding: 16px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; transition: opacity 0.2s, transform 0.1s;
  }
  #capture-btn-inline:hover:not(:disabled) { opacity: 0.9; transform: scale(0.99); }
  #capture-btn-inline:active:not(:disabled) { transform: scale(0.97); }
  #capture-btn-inline:disabled { opacity: 0.5; cursor: not-allowed; }
  #capture-btn-inline svg { width: 20px; height: 20px; stroke: #10130a; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Upload Dropzone */
  #drop-zone {
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    border: 2px dashed var(--line); border-radius: 20px; background: var(--surface); padding: 48px 24px;
    cursor: pointer; text-align: center; margin-bottom: 16px; transition: all 0.2s;
  }
  #drop-zone.active-mode { display: flex; }
  #drop-zone:hover, #drop-zone.drag-over { border-color: var(--accent); background: rgba(214,255,63,0.04); }
  .drop-icon { font-size: 40px; }
  .drop-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; }
  .drop-sub { font-size: 13px; color: var(--muted); line-height: 1.5; }
  #file-input { display: none; }

  /* Preview Strip */
  #preview-strip { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .thumb-wrap { position: relative; width: 68px; height: 68px; border-radius: 12px; overflow: hidden; border: 0.5px solid var(--line); flex-shrink: 0; }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .thumb-remove { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,0.7); border: none; color: #fff; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  
  /* Spinner */
  .spinner { display: none; width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Summary Section */
  .summary { display: none; gap: 14px; align-items: center; margin-bottom: 18px; padding: 12px 16px; background: var(--surface); border-radius: 16px; border: 0.5px solid var(--line); }
  .summary b { font-family: 'Space Grotesk', sans-serif; font-size: 15px; color: var(--ink); font-weight: 500; }
  .dot { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* Cards */
  #results-feed { display: flex; flex-direction: column; gap: 16px; padding-bottom: 20px; }
  .card { background: var(--surface); border-radius: 22px; border: 0.5px solid var(--line); overflow: hidden; animation: fadeUp 0.3s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .photo { position: relative; width: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
  .photo img { width: 100%; display: block; object-fit: contain; max-height: 500px; }
  .ann-unavailable { padding: 48px 24px; text-align: center; font-size: 13px; color: var(--muted); }
  
  /* Motion & Loaders */
  #flash-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #fff; z-index: 200; pointer-events: none; opacity: 0; transition: opacity 0.12s ease-out; }
  #flash-overlay.flash { opacity: 0.8; transition: none; }
  
  .skeleton-card { height: 320px; background: var(--surface); border-radius: 22px; border: 0.5px solid var(--line); overflow: hidden; position: relative; animation: fadeUp 0.3s ease both; margin-bottom: 16px; }
  .skeleton-card::after { content: ''; position: absolute; top: 0; left: -100%; right: 0; bottom: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent); animation: shimmer 1.5s infinite; }
  @keyframes shimmer { 100% { left: 100%; } }

  .share { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; background: rgba(10,11,10,0.55); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: background 0.2s, transform 0.1s; z-index: 10; }
  .share:hover { background: rgba(10,11,10,0.8); }
  .share:active { transform: scale(0.94); }
  .share svg { width: 16px; height: 16px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  
  .meta { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
  .meta .route { font-size: 14px; color: var(--ink); font-weight: 500; display: flex; align-items: center; gap: 6px; text-transform: lowercase; }
  .meta .route .to { color: var(--muted); font-weight: 400; }
  .meta .conf { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  
  .card.spoiled .meta .route { color: var(--spoiled); }
  .card.review .meta .route { color: var(--review); }

  /* Bottom Bar */
  .bottom { padding: 14px 16px 24px; background: linear-gradient(to top, var(--bg) 70%, transparent); position: sticky; bottom: 0; z-index: 100; }
  .scan-btn { width: 100%; background: var(--accent); color: #10130a; border: none; border-radius: 18px; padding: 16px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
  .scan-btn:hover:not(:disabled) { opacity: 0.9; transform: scale(0.99); }
  .scan-btn:active:not(:disabled) { transform: scale(0.97); }
  .scan-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .scan-btn svg { width: 20px; height: 20px; stroke: #10130a; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .upload-link { display: block; text-align: center; margin-top: 12px; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; border: none; background: none; width: 100%; font-family: inherit; }
  .upload-link:hover { color: var(--ink); }
</style>
</head>
<body>
<div id="flash-overlay"></div>

<div class="app-container">
  <div class="content">
    <header>
      <div class="word">Mar<span style="color:var(--accent)">bl</span></div>
      <div class="mode-toggle" id="input-toggle">
        <span class="on" id="mode-cam-tab">camera</span>
        <span id="mode-up-tab">upload</span>
      </div>
    </header>

    <!-- Camera panel -->
    <div id="camera-panel">
      <div class="camera-viewport">
        <video id="camera-video" autoplay playsinline muted></video>
      </div>
      <canvas id="camera-canvas"></canvas>
      <div id="camera-error"></div>
      <div class="cam-hint">
        <strong>Tip:</strong> place an ID card next to the meat for accurate size measurement.
      </div>
      <button id="capture-btn-inline" type="button" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
        capture photo
      </button>
    </div>

    <!-- Upload zone -->
    <div id="drop-zone" role="button" tabindex="0">
      <div class="drop-icon">🥩</div>
      <div class="drop-title">Drop photos here</div>
      <div class="drop-sub">or tap to choose from gallery<br>JPEG · PNG · up to 20 MB<br><br><strong style="color:var(--review)">Tip:</strong> include an ID card next to the meat for accurate size.</div>
      <input id="file-input" type="file" accept="image/*" multiple />
    </div>

    <!-- Shared thumbnail queue -->
    <div id="preview-strip"></div>

    <div class="spinner" id="spinner"></div>

    <!-- Summary -->
    <div class="summary" id="summary-strip"></div>

    <!-- Results -->
    <div id="results-feed"></div>
  </div>

  <div class="bottom">
    <button class="scan-btn" id="check-btn" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 012-2h2M4 16v2a2 2 0 002 2h2M20 8V6a2 2 0 00-2-2h-2M20 16v2a2 2 0 01-2 2h-2"/><circle cx="12" cy="12" r="3.5"/></svg>
      analyse photos
    </button>
    <button class="scan-btn" id="scan-again-btn" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 012-2h2M4 16v2a2 2 0 002 2h2M20 8V6a2 2 0 00-2-2h-2M20 16v2a2 2 0 01-2 2h-2"/><circle cx="12" cy="12" r="3.5"/></svg>
      scan another
    </button>
    <button class="upload-link" id="gallery-link" style="display:none">or upload from gallery</button>
  </div>
</div>

<script>
  // ── State ────────────────────────────────────────────────────────────────
  let selectedFiles = [];
  let activeMode    = 'camera';   // 'camera' | 'upload'
  let cameraStream  = null;

  // ── DOM refs ─────────────────────────────────────────────────────────────
  const inputToggle   = document.getElementById('input-toggle');
  const modeCamTab    = document.getElementById('mode-cam-tab');
  const modeUpTab     = document.getElementById('mode-up-tab');
  
  const cameraPanel   = document.getElementById('camera-panel');
  const cameraVideo   = document.getElementById('camera-video');
  const cameraCanvas  = document.getElementById('camera-canvas');
  const cameraError   = document.getElementById('camera-error');
  const captureBtn    = document.getElementById('capture-btn-inline');
  
  const dropZone      = document.getElementById('drop-zone');
  const fileInput     = document.getElementById('file-input');
  const previewStrip  = document.getElementById('preview-strip');
  
  const spinner       = document.getElementById('spinner');
  const summaryStrip  = document.getElementById('summary-strip');
  const resultsFeed   = document.getElementById('results-feed');
  
  const checkBtn      = document.getElementById('check-btn');
  const scanAgainBtn  = document.getElementById('scan-again-btn');
  const galleryLink   = document.getElementById('gallery-link');

  // ── Feature-detect camera ────────────────────────────────────────────────
  const hasCamera = !!navigator.mediaDevices?.getUserMedia;

  if (hasCamera) {
    inputToggle.classList.add('visible');
    galleryLink.style.display = 'block';
    startCamera();
  } else {
    cameraPanel.style.display = 'none';
    dropZone.classList.add('active-mode');
    activeMode = 'upload';
  }

  // ── Mode switching ────────────────────────────────────────────────────────
  function switchMode(mode) {
    if (activeMode === mode) return;
    activeMode = mode;
    
    cameraPanel.style.transition = 'opacity 0.15s ease';
    dropZone.style.transition = 'opacity 0.15s ease';
    cameraPanel.style.opacity = '0';
    dropZone.style.opacity = '0';

    setTimeout(() => {
      if (mode === 'camera') {
        modeCamTab.classList.add('on');
        modeUpTab.classList.remove('on');
        dropZone.classList.remove('active-mode');
        dropZone.style.display = 'none';
        cameraPanel.style.display = 'flex';
        galleryLink.style.display = 'block';
        startCamera();
      } else {
        modeUpTab.classList.add('on');
        modeCamTab.classList.remove('on');
        cameraPanel.style.display = 'none';
        dropZone.classList.add('active-mode');
        dropZone.style.display = 'flex';
        galleryLink.style.display = 'none';
        stopCamera();
      }
      setTimeout(() => {
        cameraPanel.style.opacity = '1';
        dropZone.style.opacity = '1';
      }, 20);
    }, 150);
  }

  inputToggle.addEventListener('click', () => {
    switchMode(activeMode === 'camera' ? 'upload' : 'camera');
  });

  galleryLink.addEventListener('click', () => {
    if (resultsFeed.innerHTML !== '') {
      // Reset if we are on the results view
      selectedFiles = [];
      renderPreviews();
      resultsFeed.innerHTML = '';
      summaryStrip.style.display = 'none';
      scanAgainBtn.style.display = 'none';
      checkBtn.style.display = 'none';
      inputToggle.style.display = 'flex';
      cameraPanel.style.display = 'none';
      dropZone.style.display = 'flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    switchMode('upload');
    fileInput.click();
  });

  // ── Camera lifecycle ──────────────────────────────────────────────────────
  async function startCamera() {
    cameraError.style.display = 'none';
    captureBtn.disabled = true;
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }
      });
      cameraVideo.srcObject = cameraStream;
      await new Promise(resolve => {
        cameraVideo.onloadedmetadata = resolve;
        if (cameraVideo.readyState >= 1) resolve();
      });
      captureBtn.disabled = false;
    } catch (err) {
      let msg = 'Camera error.';
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') msg = 'Permission denied.';
      else if (err.name === 'NotFoundError') msg = 'No camera found.';
      else msg = err.message;
      cameraError.textContent = msg;
      cameraError.style.display = 'block';
    }
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
    }
    cameraVideo.srcObject = null;
    captureBtn.disabled = true;
  }
  window.addEventListener('pagehide', stopCamera);

  // ── Capture ───────────────────────────────────────────────────────────────
  captureBtn.addEventListener('click', () => {
    if (!cameraStream) return;
    const vw = cameraVideo.videoWidth, vh = cameraVideo.videoHeight;
    if (!vw || !vh) return;
    
    const overlay = document.getElementById('flash-overlay');
    overlay.classList.add('flash');
    setTimeout(() => overlay.classList.remove('flash'), 80);

    cameraCanvas.width  = vw;
    cameraCanvas.height = vh;
    cameraCanvas.getContext('2d').drawImage(cameraVideo, 0, 0, vw, vh);
    cameraCanvas.toBlob(blob => {
      const file = new File([blob], `camera_capture_${Date.now()}.jpg`, { type: 'image/jpeg' });
      file._fromCamera = true;
      addFiles([file]);
      captureBtn.innerHTML = '✔ captured!';
      captureBtn.disabled  = true;
      setTimeout(() => { 
        captureBtn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg> capture photo'; 
        captureBtn.disabled = false; 
      }, 700);
    }, 'image/jpeg', 0.92);
  });

  // ── Upload zone ───────────────────────────────────────────────────────────
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    addFiles([...e.dataTransfer.files].filter(f => f.type.startsWith('image/')));
  });

  // ── Queue ─────────────────────────────────────────────────────────────────
  function addFiles(files) {
    files.forEach(f => {
      if (!selectedFiles.find(x => x.name === f.name && x.size === f.size)) selectedFiles.push(f);
    });
    renderPreviews();
  }

  function removeFile(idx) {
    selectedFiles.splice(idx, 1);
    renderPreviews();
  }

  function renderPreviews() {
    previewStrip.innerHTML = '';
    selectedFiles.forEach((file, idx) => {
      const url = URL.createObjectURL(file);
      const wrap = document.createElement('div');
      wrap.className = 'thumb-wrap';
      wrap.innerHTML = `<img src="${url}" alt="Preview" /><button class="thumb-remove">✕</button>`;
      wrap.querySelector('.thumb-remove').addEventListener('click', () => removeFile(idx));
      previewStrip.appendChild(wrap);
    });
    checkBtn.style.display = selectedFiles.length ? 'flex' : 'none';
    if(activeMode === 'camera') galleryLink.style.display = selectedFiles.length ? 'none' : 'block';
  }

  // ── Reset ─────────────────────────────────────────────────────────────────
  scanAgainBtn.addEventListener('click', () => {
    selectedFiles = [];
    renderPreviews();
    resultsFeed.innerHTML = '';
    summaryStrip.style.display = 'none';
    scanAgainBtn.style.display = 'none';
    checkBtn.style.display = 'none';
    inputToggle.style.display = 'flex';
    if (activeMode === 'camera') {
      cameraPanel.style.display = 'flex';
      galleryLink.style.display = 'block';
      startCamera();
    } else {
      dropZone.style.display = 'flex';
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ── API Submission ────────────────────────────────────────────────────────
  checkBtn.addEventListener('click', async () => {
    if (!selectedFiles.length) return;
    checkBtn.disabled = true;
    spinner.style.display = 'block';
    
    // Hide inputs during processing
    cameraPanel.style.display = 'none';
    dropZone.style.display = 'none';
    previewStrip.style.display = 'none';
    // inputToggle stays visible
    galleryLink.style.display = 'none';
    
    // Show loading skeletons
    resultsFeed.innerHTML = '';
    for(let i = 0; i < selectedFiles.length; i++) {
       resultsFeed.innerHTML += `<div class="skeleton-card" style="animation-delay: ${i*50}ms"></div>`;
    }

    const fd = new FormData();
    selectedFiles.forEach(f => fd.append('files', f));

    try {
      const resp = await fetch('/api/classify', { method: 'POST', body: fd });
      if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
      const data = await resp.json();
      renderResults(data.results);
    } catch (err) {
      resultsFeed.innerHTML = `<p style="color:var(--spoiled);padding:16px">Error: ${err.message}</p>`;
    } finally {
      spinner.style.display = 'none';
      checkBtn.disabled = false;
      checkBtn.style.display = 'none';
      scanAgainBtn.style.display = 'flex';
      galleryLink.style.display = 'block';
    }
  });

  // ── Rendering Results ─────────────────────────────────────────────────────
  function renderResults(results) {
    resultsFeed.innerHTML = '';

    // Calculate Summary
    let nGood = 0, nSpoiled = 0, nReview = 0;
    results.forEach(r => {
      if (r.error) return;
      if (r.decision === 'discard') nSpoiled++;
      else if (r.decision === 'needs_manual_review' || r.size_method === 'multiple_pieces_detected') nReview++;
      else nGood++;
    });

    summaryStrip.innerHTML = `
      <b>${results.length} checked</b>
      ${nGood    ? `<span class="dot"><i style="background:var(--good)"></i>${nGood} good</span>` : ''}
      ${nSpoiled ? `<span class="dot"><i style="background:var(--spoiled)"></i>${nSpoiled} spoiled</span>` : ''}
      ${nReview  ? `<span class="dot"><i style="background:var(--review)"></i>${nReview} review</span>` : ''}
    `;
    summaryStrip.style.display = 'flex';

    results.forEach((r, i) => {
      const card = document.createElement('div');
      card.style.animationDelay = `${i * 50}ms`;

      if (r.error) {
        card.className = 'card error';
        card.innerHTML = `<div style="padding:20px; color:var(--spoiled)">⚠ ${r.error} (${r.filename})</div>`;
        resultsFeed.appendChild(card);
        return;
      }

      // Determine colors & labels
      let cardCls = r.decision === 'discard' ? 'spoiled' : 
                   (r.decision === 'needs_manual_review' || r.size_method === 'multiple_pieces_detected') ? 'review' : 'good';
      
      card.className = `card ${cardCls}`;

      // Build Route string (e.g. "small -> grinding")
      let routeHtml = '';
      if (r.decision === 'discard') {
        routeHtml = `discard`;
      } else if (r.decision === 'packing') {
        routeHtml = `big <span class="to">&nbsp;→&nbsp;packing</span>`;
      } else if (r.decision === 'grinding') {
        if (r.size_method === 'multiple_pieces_detected') {
          routeHtml = `multi-piece <span class="to">&nbsp;→&nbsp;grinding</span>`;
        } else {
          routeHtml = `small <span class="to">&nbsp;→&nbsp;grinding</span>`;
        }
      } else if (r.decision === 'needs_manual_review') {
        routeHtml = `needs review`;
      }

      // Build Conf/Meta string (e.g. "measured · 68mm")
      let confHtml = '&nbsp;';
      if (r.size_method === 'measured' && r.longest_dimension_mm) {
        confHtml = `measured · ${Math.round(r.longest_dimension_mm)}mm`;
      } else if (r.size_method === 'estimated' && r.longest_dimension_mm) {
        confHtml = `estimated · ~${Math.round(r.longest_dimension_mm)}mm`;
      } else if (r.size_method === 'multiple_pieces_detected' && r.piece_count_estimate) {
        confHtml = `estimated · ~${r.piece_count_estimate} pieces`;
      }

      // Photo Section
      let imgHTML = '';
      if (r.annotated_image_base64) {
        imgHTML = `<img src="${r.annotated_image_base64}" alt="Result" />
                   <button class="share download-btn" data-b64="${r.annotated_image_base64}" data-filename="${r.filename}">
                     <svg viewBox="0 0 24 24"><path d="M12 16V4M12 4L7 9M12 4l5 5M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
                   </button>`;
      } else {
        const queuedFile = selectedFiles.find(f => f.name === r.filename);
        if (queuedFile) {
          const thumbUrl = URL.createObjectURL(queuedFile);
          imgHTML = `<img src="${thumbUrl}" alt="Result" />
                     <div style="position:absolute; bottom:12px; left:12px; background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:6px; font-size:12px;">annotation unavailable</div>`;
        } else {
          imgHTML = `<div class="ann-unavailable">📷 No preview available</div>`;
        }
      }

      card.innerHTML = `
        <div class="photo ${cardCls}">
          ${imgHTML}
        </div>
        <div class="meta">
          <div class="route">${routeHtml}</div>
          <div class="conf">${confHtml}</div>
        </div>
      `;

      // Wire download button
      const dlBtn = card.querySelector('.download-btn');
      if (dlBtn) {
        dlBtn.addEventListener('click', () => {
          const b64 = dlBtn.dataset.b64.replace('data:image/jpeg;base64,', '');
          const bin = atob(b64);
          const arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          const blob = new Blob([arr], { type: 'image/jpeg' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `annotated_${dlBtn.dataset.filename.replace(/\.[^.]+$/, '')}.jpg`;
          a.click();
          URL.revokeObjectURL(a.href);
        });
      }

      resultsFeed.appendChild(card);
    });
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

</body>
</html>
